<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAFAF8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Macros</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAFAF8; --card:#FFFFFF; --sunk:#F1F0EB;
  --ink:#1A1D1A; --ink-2:#5C605A; --ink-3:#8E928A;
  --line:#E3E2DB; --line-2:#CFCEC5;
  --olive:#4E6B3E; --ochre:#B8863B; --clay:#B4523C;
  --olive-soft:#E8EEE1; --ochre-soft:#F7EDDC; --clay-soft:#F7E4DF;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#141613; --card:#1C1F1B; --sunk:#101210;
    --ink:#EDEDE7; --ink-2:#9DA199; --ink-3:#6E726A;
    --line:#2A2E28; --line-2:#3B403A;
    --olive:#8FBF6E; --ochre:#DCA95C; --clay:#DC7A62;
    --olive-soft:#22301C; --ochre-soft:#332715; --clay-soft:#331D18;
  }
  body{color-scheme:dark}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:"Instrument Sans",system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.5;
  padding:0 0 calc(72px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:520px;margin:0 auto;padding:0 18px}
h1{font-size:19px;font-weight:600;margin:0;letter-spacing:-0.01em}
.eyebrow{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.08em;font-weight:500}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line-2);border-radius:9px;padding:11px 12px;width:100%}
input:focus,textarea:focus{outline:2px solid var(--olive);outline-offset:1px;border-color:transparent}
header{padding:22px 0 14px;display:flex;align-items:baseline;justify-content:space-between}
.btn{border:1px solid var(--line-2);border-radius:9px;padding:11px 14px;font-size:14px;font-weight:500;background:var(--card);display:flex;align-items:center;justify-content:center;gap:7px;width:100%}
.btn:active{background:var(--sunk)}
.btn-go{background:var(--olive);border-color:var(--olive);color:#fff;font-weight:600}
@media (prefers-color-scheme: dark){.btn-go{color:#101210}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}

/* hero */
.hero{display:flex;align-items:flex-end;gap:10px;margin:2px 0 4px}
.hero .big{font-size:60px;line-height:0.86;font-weight:500;letter-spacing:-0.03em}
.hero .den{font-size:15px;color:var(--ink-3);padding-bottom:6px}
.herolabel{font-size:13px;color:var(--ink-2);margin-bottom:20px}
.over{color:var(--clay)}

.macro{margin-bottom:15px}
.macro:last-child{margin-bottom:0}
.macro .top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;margin-bottom:6px}
.macro .left{color:var(--ink-2);font-size:13px}
.track{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden}
.fill{height:5px;border-radius:3px;transition:width .35s ease}

.rows{margin-top:18px;border-top:1px solid var(--line);padding-top:6px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.row .sub{font-size:12px;color:var(--ink-3)}
.row .cal{font-size:14px}
.x{color:var(--ink-3);font-size:18px;line-height:1;padding:4px 2px}
.empty{padding:26px 0;text-align:center;color:var(--ink-3);font-size:14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:11px;color:var(--ink-3);text-align:center;margin-bottom:7px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{aspect-ratio:1;border-radius:5px;background:var(--sunk);border:1px solid transparent;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-3)}
.day.hit{background:var(--olive);color:#fff;border-color:var(--olive)}
.day.close{background:var(--ochre);color:#fff;border-color:var(--ochre)}
.day.miss{background:var(--clay);color:#fff;border-color:var(--clay)}
@media (prefers-color-scheme: dark){.day.hit,.day.close,.day.miss{color:#101210}}
.day.blank{background:none}
.day.pre{background:none;color:var(--line-2)}
.tag{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:1px;font-weight:500}
.day.today{outline:2px solid var(--ink);outline-offset:1px}
.legend{margin-top:18px;display:flex;flex-direction:column;gap:9px;font-size:13px;color:var(--ink-2)}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:9px;vertical-align:-1px}
.tally{margin-top:16px;border-top:1px solid var(--line);padding-top:13px;font-size:13px;color:var(--ink-2)}

/* fields */
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:5px}
.four{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.note{font-size:13px;color:var(--ink-3);line-height:1.6}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:40}
nav button{flex:1;padding:13px 0 14px;font-size:12px;color:var(--ink-3);font-weight:500;display:flex;flex-direction:column;align-items:center;gap:4px}
nav button.on{color:var(--ink)}
nav .dot{width:5px;height:5px;border-radius:50%;background:transparent}
nav button.on .dot{background:var(--olive)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,10,.42);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h2{font-size:17px;font-weight:600;margin:0 0 4px}
.sheet .lede{font-size:13px;color:var(--ink-2);margin:0 0 16px;line-height:1.55}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.chip{border:1px solid var(--line-2);border-radius:999px;padding:6px 12px;font-size:13px;background:var(--card);white-space:nowrap}
.pick{width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.pick .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview{background:var(--olive-soft);border-radius:11px;padding:14px;margin-top:13px;font-size:14px}
.err{color:var(--clay);font-size:13px;margin-top:10px}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:13px;z-index:80;white-space:nowrap}
.stale{background:var(--ochre-soft);color:var(--ink);border-radius:9px;padding:9px 12px;font-size:13px;margin-bottom:14px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>

<script>
var CFG_KEY='mt.cfg', STATE_KEY='mt.state';
var cfg=null, S={targets:{cal:2600,protein:160,carbs:270,fat:65,start:''},entries:[],foods:[]};
var tab='today', calMonth=null, sheet=null, offline=false, tmp={};

/* ---------- utils ---------- */
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return iso(new Date())}
function n(v){var x=Number(v);return isFinite(x)?x:0}
function r(v){return Math.round(n(v))}
function prettyDate(s){
  var p=s.split('-'), d=new Date(+p[0],+p[1]-1,+p[2]);
  return d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
}
function toast(msg){
  var el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  document.body.appendChild(el); setTimeout(function(){el.remove()},2200);
}

/* ---------- storage ---------- */
function loadLocal(){
  try{cfg=JSON.parse(localStorage.getItem(CFG_KEY))}catch(e){cfg=null}
  try{var s=JSON.parse(localStorage.getItem(STATE_KEY)); if(s&&s.targets)S=s}catch(e){}
}
function saveLocal(){try{localStorage.setItem(STATE_KEY,JSON.stringify(S))}catch(e){}}

/* ---------- api ---------- */
function api(action,payload){
  var body=JSON.stringify(Object.assign({action:action,secret:cfg.secret},payload||{}));
  return fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body,redirect:'follow'})
    .then(function(res){return res.text()})
    .then(function(t){
      var d; try{d=JSON.parse(t)}catch(e){throw new Error('Sheet returned something unexpected. Check the web app URL.')}
      if(!d.ok) throw new Error(d.error||'Request failed');
      return d;
    });
}
function sync(){
  return api('sync').then(function(d){
    S.targets=d.targets; S.entries=d.entries; S.foods=d.foods;
    offline=false; saveLocal(); render();
  }).catch(function(e){ offline=true; render(); throw e; });
}

/* ---------- day math ---------- */
function entriesFor(date){return S.entries.filter(function(e){return e.date===date})}
function totals(list){
  return list.reduce(function(a,e){
    a.cal+=n(e.cal); a.protein+=n(e.protein); a.carbs+=n(e.carbs); a.fat+=n(e.fat); return a;
  },{cal:0,protein:0,carbs:0,fat:0});
}
var KEYS=['cal','protein','carbs','fat'];
/* calories and protein are floors, fat is a cap, carbs are tracked but not graded */
function floorGrade(have,goal){
  if(goal<=0) return 0;
  if(have>=goal*0.95) return 0;
  if(have>=goal*0.90) return 1;
  return 2;
}
function capGrade(have,goal){
  if(goal<=0) return 0;
  if(have<=goal) return 0;
  if(have<=goal*1.05) return 1;
  return 2;
}
function status(date){
  if(S.targets.start && date<S.targets.start) return 'pre';
  var list=entriesFor(date);
  if(!list.length) return 'none';
  var t=totals(list);
  var worst=Math.max(
    floorGrade(t.cal,n(S.targets.cal)),
    floorGrade(t.protein,n(S.targets.protein)),
    capGrade(t.fat,n(S.targets.fat))
  );
  return ['hit','close','miss'][worst];
}
function streak(){
  var d=new Date(), c=0;
  for(var i=0;i<400;i++){
    var k=iso(d);
    if(S.targets.start && k<S.targets.start) break;
    if(!entriesFor(k).length) break;
    c++; d.setDate(d.getDate()-1);
  }
  return c;
}

/* ---------- render ---------- */
function render(){
  if(!cfg){renderSetup();return}
  var a=$('app');
  if(tab==='today') a.innerHTML=viewToday();
  else if(tab==='calendar') a.innerHTML=viewCalendar();
  else a.innerHTML=viewTargets();
  renderNav();
  renderSheet();
}
function renderNav(){
  var items=[['today','Today'],['calendar','Calendar'],['targets','Targets']];
  $('nav').innerHTML=items.map(function(i){
    return '<button onclick="go(\''+i[0]+'\')" class="'+(tab===i[0]?'on':'')+'"><span class="dot"></span>'+i[1]+'</button>';
  }).join('');
}
function go(t){tab=t;render();window.scrollTo(0,0)}

function bar(label,key,color,t,mode){
  var goal=n(S.targets[key]), have=t[key], left=goal-have;
  var pct=goal>0?Math.min(100,(have/goal)*100):0;
  var note, cls='left';
  if(mode==='floor') note = left>0 ? r(left)+'g to go' : 'met';
  else if(mode==='cap'){
    if(left>=0) note = r(left)+'g under cap';
    else { note = r(-left)+'g over cap'; cls='left over'; }
  } else note = left>0 ? r(left)+'g to go' : '+'+r(-left)+'g';
  var tag = mode==='cap' ? ' <span class="tag">cap</span>' : (mode==='floor' ? ' <span class="tag">floor</span>' : ' <span class="tag">tracked</span>');
  return '<div class="macro"><div class="top"><span>'+label+tag+'</span>'+
    '<span class="'+cls+' num">'+note+'</span></div>'+
    '<div class="track"><div class="fill" style="width:'+pct+'%;background:'+color+'"></div></div></div>';
}

function viewToday(){
  var d=today(), list=entriesFor(d), t=totals(list);
  var left=n(S.targets.cal)-t.cal;
  var rows=list.length? list.map(function(e){
    return '<div class="row"><div><div class="name">'+esc(e.desc)+'</div>'+
      '<div class="sub num">'+r(e.protein)+'p · '+r(e.carbs)+'c · '+r(e.fat)+'f</div></div>'+
      '<div class="cal num">'+r(e.cal)+'</div>'+
      '<button class="x" aria-label="Remove '+esc(e.desc)+'" onclick="del(\''+e.id+'\')">&times;</button></div>';
  }).join('') : '<div class="empty">Nothing logged yet today.</div>';

  return '<div class="wrap">'+
    '<header><h1>Today</h1><span class="eyebrow">'+new Date().toLocaleDateString(undefined,{month:'short',day:'numeric'})+'</span></header>'+
    (offline?'<div class="stale">Showing your last saved data — couldn\'t reach the sheet.</div>':'')+
    '<div class="card">'+
      '<div class="hero"><span class="big num">'+r(Math.abs(left))+'</span>'+
      '<span class="den num">/ '+r(S.targets.cal)+'</span></div>'+
      '<div class="herolabel">'+(left>0?'calories to go':'over target — calories are a floor, so this is fine')+'</div>'+
      bar('Protein','protein','var(--olive)',t,'floor')+
      bar('Carbs','carbs','var(--ink-3)',t,'track')+
      bar('Fat','fat','var(--clay)',t,'cap')+
      '<div class="rows">'+rows+'</div>'+
    '</div>'+
    '<div class="actions">'+
      '<button class="btn" onclick="open_(\'recent\')">Recent</button>'+
      '<button class="btn" onclick="open_(\'paste\')">Paste estimate</button>'+
      '<button class="btn" style="grid-column:1/-1" onclick="open_(\'manual\')">Enter by hand</button>'+
    '</div>'+
  '</div>';
}

function viewCalendar(){
  var now=calMonth?new Date(calMonth):new Date(); now.setDate(1);
  var y=now.getFullYear(), m=now.getMonth();
  var first=new Date(y,m,1), start=(first.getDay()+6)%7;
  var days=new Date(y,m+1,0).getDate();
  var cells='';
  for(var i=0;i<start;i++) cells+='<div class="day blank"></div>';
  var hits=0, logged=0;
  for(var dd=1;dd<=days;dd++){
    var date=iso(new Date(y,m,dd)), st=status(date);
    if(st!=='none'&&st!=='pre'){logged++; if(st==='hit')hits++}
    var cls=(st==='none'||st==='pre')?'':st;
    if(st==='pre') cls='pre';
    cells+='<button class="day '+cls+(date===today()?' today':'')+'" onclick="openDay(\''+date+'\')">'+dd+'</button>';
  }
  var sk=streak();
  return '<div class="wrap">'+
    '<header><h1>Calendar</h1></header>'+
    '<div class="card">'+
      '<div class="cal-head"><button class="chip" onclick="shiftMonth(-1)">&larr;</button>'+
      '<strong style="font-weight:600">'+now.toLocaleDateString(undefined,{month:'long',year:'numeric'})+'</strong>'+
      '<button class="chip" onclick="shiftMonth(1)">&rarr;</button></div>'+
      '<div class="dow"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>'+
      '<div class="grid">'+cells+'</div>'+
      '<div class="legend">'+
        '<div><span class="sw" style="background:var(--olive)"></span>Calories &amp; protein made, fat under cap</div>'+
        '<div><span class="sw" style="background:var(--ochre)"></span>Close — within 10% under, or 5% over on fat</div>'+
        '<div><span class="sw" style="background:var(--clay)"></span>Missed by more than that</div>'+
        '<div><span class="sw" style="background:var(--sunk)"></span>Nothing logged</div>'+
      '</div>'+
      '<div class="tally num">'+hits+' of '+logged+' logged days on target</div>'+
      '<div class="tally num" style="border-top:none;padding-top:0;margin-top:5px">'+
        (sk?sk+' day'+(sk===1?'':'s')+' logged in a row':'No streak — nothing logged today yet')+'</div>'+
    '</div>'+
    '<p class="note wrap" style="padding:14px 0 0">Carbs are tracked but don\'t affect the colors. Tap any day to see or fix what you logged.</p>'+
  '</div>';
}
function shiftMonth(k){
  var base=calMonth?new Date(calMonth):new Date(); base.setDate(1);
  base.setMonth(base.getMonth()+k); calMonth=base.toISOString(); render();
}

function viewTargets(){
  var t=S.targets;
  return '<div class="wrap">'+
    '<header><h1>Targets</h1></header>'+
    '<div class="card">'+
      '<div class="field"><label for="t_cal">Calories <span class="tag">floor</span></label><input id="t_cal" class="num" type="number" inputmode="numeric" value="'+r(t.cal)+'"></div>'+
      '<div class="four">'+
        '<div class="field"><label for="t_protein">Protein (g) <span class="tag">floor</span></label><input id="t_protein" class="num" type="number" inputmode="numeric" value="'+r(t.protein)+'"></div>'+
        '<div class="field"><label for="t_fat">Fat (g) <span class="tag">cap</span></label><input id="t_fat" class="num" type="number" inputmode="numeric" value="'+r(t.fat)+'"></div>'+
        '<div class="field"><label for="t_carbs">Carbs (g) <span class="tag">tracked</span></label><input id="t_carbs" class="num" type="number" inputmode="numeric" value="'+r(t.carbs)+'"></div>'+
      '</div>'+
      '<div class="field"><label for="t_start">Start date</label><input id="t_start" type="date" value="'+esc(t.start||'')+'"></div>'+
      '<button class="btn btn-go" style="margin-top:6px" onclick="saveTargets()">Save targets</button>'+
      '<p class="note" style="margin-bottom:0">Calories and protein pass at or above. Fat passes at or below. Carbs show up everywhere but never change a day\'s color. Days before the start date stay blank.</p>'+
    '</div>'+
    '<div class="card" style="margin-top:14px">'+
      '<div class="eyebrow" style="margin-bottom:10px">Connection</div>'+
      '<p class="note" style="margin-top:0">Logging to your sheet'+(offline?' — currently unreachable.':'.')+'</p>'+
      '<button class="btn" onclick="reconnect()">Change sheet connection</button>'+
    '</div>'+
  '</div>';
}
function saveTargets(){
  var t={cal:n($('t_cal').value),protein:n($('t_protein').value),carbs:n($('t_carbs').value),fat:n($('t_fat').value),start:$('t_start').value||''};
  S.targets=t; saveLocal(); render();
  api('targets',{targets:t}).then(function(){toast('Targets saved')}).catch(function(e){toast(e.message)});
}

/* ---------- sheets ---------- */
function open_(kind){sheet={kind:kind}; tmp={}; renderSheet()}
function openDay(date){sheet={kind:'day',date:date}; renderSheet()}
function closeSheet(){sheet=null; renderSheet()}
function renderSheet(){
  var ex=$('scrim'); if(ex)ex.remove();
  if(!sheet)return;
  var html='';
  if(sheet.kind==='recent')html=sheetRecent();
  else if(sheet.kind==='paste')html=sheetPaste();
  else if(sheet.kind==='manual')html=sheetManual();
  else if(sheet.kind==='day')html=sheetDay();
  var div=document.createElement('div');
  div.id='scrim'; div.className='scrim';
  div.onclick=function(e){if(e.target===div)closeSheet()};
  div.innerHTML='<div class="sheet">'+html+'</div>';
  document.body.appendChild(div);
}
function head(title,lede){
  return '<div class="sheet-head"><div><h2>'+title+'</h2></div><button class="chip" onclick="closeSheet()">Close</button></div>'+
    (lede?'<p class="lede">'+lede+'</p>':'<div style="height:14px"></div>');
}

function sheetRecent(){
  var q=(tmp.q||'').toLowerCase();
  var list=S.foods.slice().sort(function(a,b){return n(b.count)-n(a.count)})
    .filter(function(f){return !q||f.name.toLowerCase().indexOf(q)>-1}).slice(0,40);
  var rows=list.length? list.map(function(f,i){
    return '<button class="pick" onclick="logFood('+i+')"><span class="name">'+esc(f.name)+'</span>'+
      '<span class="sub num">'+r(f.protein)+'p '+r(f.carbs)+'c '+r(f.fat)+'f</span>'+
      '<span class="num">'+r(f.cal)+'</span></button>';
  }).join('') : '<div class="empty">Nothing here yet. Anything you log shows up in this list next time.</div>';
  tmp.list=list;
  return head('Recent foods','Tap to log it again.')+
    '<input id="q" placeholder="Search" value="'+esc(tmp.q||'')+'" oninput="tmp.q=this.value;renderSheet();var e=document.getElementById(\'q\');e.focus();e.setSelectionRange(e.value.length,e.value.length)">'+
    '<div style="margin-top:8px">'+rows+'</div>';
}
function logFood(i){
  var f=tmp.list[i];
  addEntry({desc:f.name,cal:f.cal,protein:f.protein,carbs:f.carbs,fat:f.fat,src:'recent'});
}

var PROMPT='Estimate the macros in this meal. Reply with ONLY a JSON object, no other text:\n{"desc":"short name","cal":0,"protein":0,"carbs":0,"fat":0}';
function sheetPaste(){
  return head('Paste an estimate','Copy the prompt, send it to Claude with a photo or a description, then paste the JSON it gives back.')+
    '<button class="btn" onclick="copyPrompt()">Copy the prompt</button>'+
    '<textarea id="pj" rows="5" style="margin-top:11px" placeholder=\'{"desc":"chicken and rice","cal":680,...}\'>'+esc(tmp.raw||'')+'</textarea>'+
    (tmp.parsed?'<div class="preview"><strong style="font-weight:600">'+esc(tmp.parsed.desc)+'</strong><br>'+
      '<span class="num">'+r(tmp.parsed.cal)+' cal · '+r(tmp.parsed.protein)+'p · '+r(tmp.parsed.carbs)+'c · '+r(tmp.parsed.fat)+'f</span></div>':'')+
    (tmp.err?'<div class="err">'+esc(tmp.err)+'</div>':'')+
    '<div style="margin-top:12px">'+(tmp.parsed
      ? '<button class="btn btn-go" onclick="confirmPaste()">Log it</button>'
      : '<button class="btn" onclick="parsePaste()">Read it</button>')+'</div>';
}
function copyPrompt(){
  navigator.clipboard.writeText(PROMPT).then(function(){toast('Prompt copied')},function(){toast('Copy failed — select it manually')});
}
function parsePaste(){
  var raw=$('pj').value; tmp.raw=raw; tmp.err=''; tmp.parsed=null;
  var t=raw.replace(/```[a-z]*/gi,'').trim();
  var a=t.indexOf('{'), b=t.lastIndexOf('}');
  if(a>-1&&b>a) t=t.slice(a,b+1);
  try{
    var o=JSON.parse(t);
    tmp.parsed={
      desc:o.desc||o.description||o.name||'Meal',
      cal:n(o.cal!=null?o.cal:o.calories),
      protein:n(o.protein!=null?o.protein:o.protein_g),
      carbs:n(o.carbs!=null?o.carbs:o.carbs_g),
      fat:n(o.fat!=null?o.fat:o.fat_g)
    };
    if(!tmp.parsed.cal&&!tmp.parsed.protein) tmp.err='That parsed, but every number came out zero. Check the JSON.';
  }catch(e){ tmp.err='Couldn\'t read that as JSON. Paste just the object, starting with {.' }
  renderSheet();
}
function confirmPaste(){var p=tmp.parsed; p.src='claude'; addEntry(p)}

function sheetManual(){
  return head('Enter by hand','')+
    '<div class="field"><label for="m_desc">What was it</label><input id="m_desc" placeholder="Chicken and rice"></div>'+
    '<div class="field"><label for="m_cal">Calories</label><input id="m_cal" class="num" type="number" inputmode="numeric"></div>'+
    '<div class="four">'+
      '<div class="field"><label for="m_protein">Protein (g)</label><input id="m_protein" class="num" type="number" inputmode="numeric"></div>'+
      '<div class="field"><label for="m_carbs">Carbs (g)</label><input id="m_carbs" class="num" type="number" inputmode="numeric"></div>'+
      '<div class="field"><label for="m_fat">Fat (g)</label><input id="m_fat" class="num" type="number" inputmode="numeric"></div>'+
    '</div>'+
    '<button class="btn btn-go" onclick="submitManual()">Log it</button>';
}
function submitManual(){
  var d=$('m_desc').value.trim();
  if(!d){toast('Give it a name first');return}
  addEntry({desc:d,cal:n($('m_cal').value),protein:n($('m_protein').value),carbs:n($('m_carbs').value),fat:n($('m_fat').value),src:'manual'});
}

function sheetDay(){
  var list=entriesFor(sheet.date), t=totals(list);
  var rows=list.length? list.map(function(e){
    return '<div class="row"><div><div class="name">'+esc(e.desc)+'</div>'+
      '<div class="sub num">'+r(e.protein)+'p · '+r(e.carbs)+'c · '+r(e.fat)+'f</div></div>'+
      '<div class="cal num">'+r(e.cal)+'</div>'+
      '<button class="x" aria-label="Remove" onclick="del(\''+e.id+'\')">&times;</button></div>';
  }).join('') : '<div class="empty">Nothing logged this day.</div>';
  var st=status(sheet.date);
  var word={hit:'On target',close:'Close',miss:'Missed',none:'No entries',pre:'Before your start date'}[st];
  return head(prettyDate(sheet.date),word)+
    '<div class="card">'+rows+
      (list.length?'<div class="tally num">'+r(t.cal)+' cal · '+r(t.protein)+'p · '+r(t.carbs)+'c · '+r(t.fat)+'f</div>':'')+
    '</div>'+
    '<button class="btn" style="margin-top:12px" onclick="addToDay(\''+sheet.date+'\')">Add to this day</button>';
}
function addToDay(date){
  sheet={kind:'manual'}; tmp={date:date}; renderSheet();
}

/* ---------- mutations ---------- */
function addEntry(e){
  var entry={
    id:'x'+Date.now()+Math.floor(Math.random()*999),
    date:tmp.date||today(),
    desc:e.desc,cal:n(e.cal),protein:n(e.protein),carbs:n(e.carbs),fat:n(e.fat),src:e.src||'manual'
  };
  S.entries.push(entry);
  var f=S.foods.filter(function(x){return x.name.toLowerCase()===entry.desc.toLowerCase()})[0];
  if(f) f.count=n(f.count)+1;
  else S.foods.push({name:entry.desc,cal:entry.cal,protein:entry.protein,carbs:entry.carbs,fat:entry.fat,count:1});
  saveLocal(); closeSheet(); render();
  api('add',{entry:entry}).catch(function(err){toast('Saved here, not to the sheet yet')});
}
function del(id){
  S.entries=S.entries.filter(function(e){return e.id!==id});
  saveLocal(); render(); if(sheet)renderSheet();
  api('del',{id:id}).catch(function(){toast('Removed here, not from the sheet yet')});
}

/* ---------- setup ---------- */
function renderSetup(){
  $('nav').innerHTML='';
  $('app').innerHTML='<div class="wrap">'+
    '<header><h1>Connect your sheet</h1></header>'+
    '<div class="card">'+
      '<p class="note" style="margin-top:0">Paste the web app URL from your Apps Script deployment, and the secret you set in the script. They stay on this phone — they are never part of the site.</p>'+
      '<div class="field" style="margin-top:16px"><label for="c_url">Web app URL</label><input id="c_url" placeholder="https://script.google.com/macros/s/.../exec"></div>'+
      '<div class="field"><label for="c_secret">Secret</label><input id="c_secret"></div>'+
      '<button class="btn btn-go" onclick="saveCfg()">Connect</button>'+
      '<div id="setup_err" class="err"></div>'+
    '</div>'+
  '</div>';
}
function saveCfg(){
  var url=$('c_url').value.trim(), secret=$('c_secret').value.trim();
  if(!url||!secret){$('setup_err').textContent='Both fields are needed.';return}
  cfg={url:url,secret:secret};
  $('setup_err').textContent='Connecting…';
  sync().then(function(){
    localStorage.setItem(CFG_KEY,JSON.stringify(cfg)); toast('Connected');
  }).catch(function(e){
    var el=$('setup_err'); cfg=null; renderSetup();
    $('setup_err').textContent=e.message;
  });
}
function reconnect(){localStorage.removeItem(CFG_KEY); cfg=null; render()}

/* ---------- boot ---------- */
loadLocal();
render();
if(cfg) sync().catch(function(){});
</script>
</body>
</html>
